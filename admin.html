<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>관리자 · 나의 직무 기획 다이어리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--paper:#fffdf7;--desk:#efe8dc;--ink:#2a2430;--muted:#5d5566;--bd:#b9ab9b;--line:#e7dccd;--pink2:#c2546a;--mint:#d9efe3;--mint2:#2f8a63;--lav2:#6253a8;--butter:#f8eccb;--hf:'Jua','Gowun Dodum',system-ui,sans-serif}
*{box-sizing:border-box}
html{font-size:18px}
body{margin:0;background:var(--desk);color:var(--ink);font-family:'Gowun Dodum',system-ui,sans-serif;line-height:1.6}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:0 18px}
header{background:#2f3a5c;color:#fff;padding:14px 0}
header .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-family:var(--hf);font-weight:400;font-size:1.6rem;margin:0;flex:1}
.btn{border:2px solid var(--ink);background:#fff;border-radius:12px;padding:6px 16px;font-family:var(--hf);font-size:1rem;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.pri{background:var(--pink2);border-color:#8c3346;color:#fff;box-shadow:0 3px 0 #8c3346}
.btn.red{background:#fff3f4;border-color:#b3263d;color:#b3263d;box-shadow:0 3px 0 #b3263d}
header .btn{border-color:#fff;box-shadow:none;background:transparent;color:#fff}
.card{background:var(--paper);border:2px solid var(--bd);border-radius:18px;padding:18px 20px;margin:18px 0}
.login{max-width:440px;margin:80px auto;text-align:center}
.login input{width:100%;font-size:1.3rem;padding:12px 16px;border:2px solid #d8ccbc;border-radius:14px;margin:12px 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px 16px}
.stat b{display:block;font-family:var(--hf);font-weight:400;font-size:2.2rem;line-height:1.2}
.stat span{color:var(--muted)}
.chbars{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
@media (max-width:760px){.chbars{grid-template-columns:repeat(3,1fr)}}
.chb{text-align:center;font-family:var(--hf)}
.chb .e{font-size:1.6rem}
.chb .bar{height:12px;background:#fff;border:1.5px solid var(--bd);border-radius:99px;overflow:hidden;margin:4px 0}
.chb .bar i{display:block;height:100%;background:var(--mint2)}
.chb small{font-family:'Gowun Dodum';color:var(--muted)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tools input,.tools select{padding:8px 12px;border:2px solid #d8ccbc;border-radius:12px;background:#fff}
.tools input{flex:1;min-width:200px}
.tbl{width:100%;border-collapse:collapse;font-size:.95rem}
.tbl th,.tbl td{border-bottom:1.5px solid var(--line);padding:10px 8px;vertical-align:top;text-align:left}
.tbl th{font-family:var(--hf);font-weight:400;color:var(--muted);white-space:nowrap;position:sticky;top:0;background:var(--paper)}
.tbl tr:hover td{background:#fbf6ee}
.name{font-family:var(--hf);font-size:1.15rem}
.pbar{width:120px;height:14px;background:#fff;border:1.5px solid var(--bd);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#f0a3b1,var(--pink2))}
.chs{white-space:nowrap;font-size:1.1rem;letter-spacing:1px}
.chs .off{opacity:.18;filter:grayscale(1)}
.clip{max-width:280px;color:var(--muted)}
.stale{color:#b3263d}
.tag{display:inline-block;font-size:.8rem;padding:0 10px;border-radius:99px;background:var(--mint);color:var(--mint2);font-family:var(--hf)}
.scroll{overflow-x:auto}
.empty{text-align:center;color:var(--muted);padding:40px}
.err{background:#fff3f4;border:2px solid #e6a3ae;border-radius:14px;padding:10px 14px;margin:12px 0}
dialog{width:min(920px,94vw);max-height:90vh;border:2px solid var(--bd);border-radius:20px;padding:0;background:var(--paper)}
dialog::backdrop{background:rgba(42,36,48,.45)}
.dhead{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:2px solid var(--line);position:sticky;top:0;background:var(--paper)}
.dhead h2{font-family:var(--hf);font-weight:400;margin:0;flex:1}
.dbody{padding:6px 22px 22px}
.dbody h3{font-family:var(--hf);font-weight:400;color:#33699c;margin:18px 0 6px}
pre.ws{white-space:pre-wrap;background:#fff;border:2px dashed var(--line);border-radius:12px;padding:12px;font-size:.92rem;line-height:1.7}
.report h1{font-family:var(--hf);font-weight:400;font-size:1.5rem}
.report h2{font-family:var(--hf);font-weight:400;font-size:1.2rem;color:#33699c;margin:16px 0 4px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:99px;padding:8px 22px;z-index:99}
</style>
</head>
<body>
<header><div class="wrap"><h1>🐞 관리자 · 나의 직무 기획 다이어리</h1>
  <span id="when" style="opacity:.8;font-size:.9rem"></span>
  <button class="btn hide-login" id="refresh">🔄 새로고침</button>
  <button class="btn hide-login" id="logout">나가기</button></div></header>

<main class="wrap">
  <div class="card login" id="loginBox">
    <h2 style="font-family:var(--hf);font-weight:400;font-size:1.6rem;margin:0">🔒 관리자 비밀번호</h2>
    <p style="color:var(--muted);margin:6px 0 0">Vercel 환경 변수 <b>ADMIN_PASSWORD</b>에 넣은 값</p>
    <input type="password" id="pw" placeholder="비밀번호" autofocus>
    <button class="btn pri" id="loginBtn" style="font-size:1.2rem;padding:8px 30px">들어가기</button>
    <div id="loginErr"></div>
  </div>

  <div id="dash" hidden>
    <div class="stats">
      <div class="stat"><b id="sN">0</b><span>👩‍🎓 학생 수</span></div>
      <div class="stat"><b id="sAvg">0%</b><span>📈 평균 진행률</span></div>
      <div class="stat"><b id="sRep">0</b><span>📜 기획서 완성</span></div>
      <div class="stat"><b id="sAct">0</b><span>✏️ 최근 10분 안에 쓰는 중</span></div>
    </div>
    <div class="card"><div class="chbars" id="chbars"></div></div>
    <div class="card">
      <div class="tools">
        <input id="q" placeholder="🔍 이름·직무·문제로 찾기">
        <select id="sort"><option value="updated">최근 저장 순</option><option value="progress">진행률 높은 순</option><option value="low">진행률 낮은 순</option><option value="nick">이름 순</option></select>
        <label><input type="checkbox" id="auto" checked> 30초마다 자동 새로고침</label>
        <button class="btn" id="csv">⬇️ 엑셀(CSV)</button>
        <button class="btn red" id="delAll">🗑️ 전체 삭제</button>
      </div>
      <div class="scroll" style="margin-top:12px"><table class="tbl">
        <thead><tr><th>이름 · 직무</th><th>진행</th><th>장</th><th>나의 직무 문제 한 줄</th><th>최종안</th><th>AI</th><th>마지막 저장</th><th></th></tr></thead>
        <tbody id="rows"></tbody></table></div>
    </div>
  </div>
</main>

<dialog id="dlg"><div class="dhead"><h2 id="dTitle"></h2>
  <button class="btn" id="dCopy">📋 기획서 복사</button><button class="btn" id="dPrint">🖨️ 인쇄</button><button class="btn" id="dClose">닫기</button></div>
  <div class="dbody" id="dBody"></div></dialog>

<script>
'use strict';
const CH = [['📓','직무 문제'],['🔍','원인'],['🎨','SCAMPER'],['🤖','AI와 함께'],['🏆','결정'],['📜','기획서']];
const DEMO = new URLSearchParams(location.search).has('demo');
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let PW = sessionStorage.getItem('plan-admin-pw') || '', LIST = [], autoT;
function toast(m){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.append(t); setTimeout(() => t.remove(), 2000); }

async function api(body){
  if (DEMO) return demo(body);
  const r = await fetch('api/admin', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:PW, ...body})});
  const j = await r.json().catch(() => ({error:'관리자 서버(api/admin)에 연결하지 못했어요'}));
  if (!r.ok || j.error) { const e = new Error(j.error || ('오류 ' + r.status)); e.status = r.status; throw e; }
  return j;
}
async function load(){
  try {
    const j = await api({}); LIST = j.students || [];
    $('#loginBox').hidden = true; $('#dash').hidden = false; document.querySelectorAll('.hide-login').forEach(b => b.hidden = false);
    $('#when').textContent = new Date().toLocaleTimeString('ko-KR') + ' 기준';
    draw();
  } catch(e) {
    if (e.status === 401) { logout(); $('#loginErr').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
    else if ($('#dash').hidden) $('#loginErr').innerHTML = `<div class="err">${esc(e.message)}</div>`;
    else toast('😢 ' + e.message);
  }
}
function logout(){ PW = ''; sessionStorage.removeItem('plan-admin-pw'); $('#loginBox').hidden = false; $('#dash').hidden = true; document.querySelectorAll('.hide-login').forEach(b => b.hidden = true); }
const pct = s => s.progress && s.progress.total ? Math.round(s.progress.n / s.progress.total * 100) : 0;
const ago = iso => { const m = Math.floor((Date.now() - new Date(iso)) / 60000); return m < 1 ? '방금' : m < 60 ? m + '분 전' : m < 1440 ? Math.floor(m / 60) + '시간 전' : new Date(iso).toLocaleDateString('ko-KR'); };

function draw(){
  const n = LIST.length;
  $('#sN').textContent = n;
  $('#sAvg').textContent = (n ? Math.round(LIST.reduce((a, s) => a + pct(s), 0) / n) : 0) + '%';
  $('#sRep').textContent = LIST.filter(s => s.report).length;
  $('#sAct').textContent = LIST.filter(s => Date.now() - new Date(s.updated) < 600000).length;
  $('#chbars').innerHTML = CH.map(([e, t], i) => { const d = LIST.filter(s => (s.progress?.chapters || [])[i]).length;
    return `<div class="chb"><div class="e">${e}</div>${t}<div class="bar"><i style="width:${n ? d / n * 100 : 0}%"></i></div><small>완료 ${d} / ${n}</small></div>`; }).join('');
  const q = $('#q').value.trim().toLowerCase(), sort = $('#sort').value;
  let rows = LIST.filter(s => !q || [s.nick, s.job, s.oneline, s.final].join(' ').toLowerCase().includes(q));
  rows.sort({updated:(a, b) => String(b.updated).localeCompare(a.updated), progress:(a, b) => pct(b) - pct(a), low:(a, b) => pct(a) - pct(b), nick:(a, b) => String(a.nick).localeCompare(b.nick, 'ko')}[sort]);
  $('#rows').innerHTML = rows.map(s => `<tr>
    <td><div class="name">${esc(s.nick || '(이름 없음)')} ${s.mood1 || s.mood0 || ''}</div><small style="color:var(--muted)">${esc(s.job || '')}</small></td>
    <td><div class="pbar"><i style="width:${pct(s)}%"></i></div><small>${s.progress?.n || 0}/${s.progress?.total || 0}칸 · ${pct(s)}%</small> ${s.report ? '<span class="tag">기획서 ✔</span>' : ''}</td>
    <td class="chs">${CH.map(([e], i) => `<span class="${(s.progress?.chapters || [])[i] ? '' : 'off'}" title="${CH[i][1]}">${e}</span>`).join('')}<br><small style="color:var(--muted)">지금: ${CH[s.progress?.ch || 0]?.[1] || ''}</small></td>
    <td class="clip">${esc(s.oneline || '—')}</td>
    <td class="clip">${esc(s.final || '—')}</td>
    <td>${s.aiUsed || 0}회</td>
    <td class="${Date.now() - new Date(s.updated) > 1800000 ? 'stale' : ''}">${ago(s.updated)}</td>
    <td style="white-space:nowrap"><button class="btn" data-view="${esc(s.id)}">보기</button> <button class="btn red" data-del="${esc(s.id)}" title="삭제">🗑️</button></td></tr>`).join('')
    || `<tr><td colspan="8" class="empty">${n ? '찾는 학생이 없어요' : '아직 저장된 학생이 없어요. 학생이 이름을 쓰고 한 칸 쓰면 여기 나타나요.'}</td></tr>`;
  document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => view(b.dataset.view));
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    const s = LIST.find(x => x.id === b.dataset.del);
    if (!confirm(`${s.nick || '이 학생'}의 기록을 지울까요? (학생 브라우저에는 남아 있어요)`)) return;
    try { await api({action:'delete', id:s.id}); toast('지웠어요'); load(); } catch(e) { toast('😢 ' + e.message); }
  });
}
function md(src){
  const lines = esc(src).split('\n'); let h = '', list = '';
  const close = () => { if (list) { h += `</${list}>`; list = ''; } };
  const inl = t => t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  for (const ln of lines) { let m;
    if ((m = ln.match(/^(#{1,3})\s+(.*)/))) { close(); h += `<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`; }
    else if ((m = ln.match(/^\s*[-*]\s+(.*)/))) { if (list !== 'ul') { close(); h += '<ul>'; list = 'ul'; } h += `<li>${inl(m[1])}</li>`; }
    else if ((m = ln.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== 'ol') { close(); h += '<ol>'; list = 'ol'; } h += `<li>${inl(m[1])}</li>`; }
    else if (!ln.trim()) close(); else { close(); h += `<p>${inl(ln)}</p>`; } }
  close(); return h;
}
let cur = null;
function view(id){
  cur = LIST.find(x => x.id === id); if (!cur) return;
  $('#dTitle').textContent = `${cur.nick || '(이름 없음)'} · ${pct(cur)}%`;
  $('#dBody').innerHTML = `<h3>📝 나의 직무상의 문제정의</h3><p>${esc(cur.sentence || '—')}</p>
    <h3>📜 AI 기획서</h3>${cur.report ? `<div class="report">${md(cur.report)}</div>` : '<p style="color:var(--muted)">아직 받지 않았어요</p>'}
    <h3>📄 워크시트 전체</h3><pre class="ws">${esc(cur.ws || '')}</pre>`;
  $('#dlg').showModal(); $('#dBody').scrollTop = 0;
}
$('#dClose').onclick = () => $('#dlg').close();
$('#dCopy').onclick = () => { if (!cur?.report) return toast('기획서가 없어요'); navigator.clipboard.writeText(cur.report); toast('복사했어요'); };
$('#dPrint').onclick = () => { const w = open('', '_blank'); w.document.write(`<meta charset="utf-8"><title>${esc(cur.nick)}</title><body style="font-family:sans-serif;line-height:1.7;max-width:800px;margin:auto">${$('#dBody').innerHTML}</body>`); w.document.close(); w.print(); };
$('#csv').onclick = () => {
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const head = ['이름','직무','진행률(%)','채운 칸',...CH.map(c => c[1] + ' 완료'),'직무 문제 한 줄','문제정의 한 문장','최종안','AI 호출','기획서','마지막 저장'];
  const body = LIST.map(s => [s.nick, s.job, pct(s), `${s.progress?.n || 0}/${s.progress?.total || 0}`, ...CH.map((c, i) => (s.progress?.chapters || [])[i] ? 'O' : ''), s.oneline, s.sentence, s.final, s.aiUsed || 0, s.report ? 'O' : '', new Date(s.updated).toLocaleString('ko-KR')].map(q).join(','));
  const blob = new Blob(['﻿' + [head.map(q).join(','), ...body].join('\r\n')], {type:'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `직무기획다이어리_${new Date().toISOString().slice(0, 10)}.csv`; a.click();
};
$('#delAll').onclick = async () => {
  if (prompt(`학생 ${LIST.length}명의 기록을 모두 지워요. 계속하려면 '전체 삭제'라고 적어 주세요.`) !== '전체 삭제') return;
  try { await api({action:'deleteAll'}); toast('모두 지웠어요'); load(); } catch(e) { toast('😢 ' + e.message); }
};
$('#loginBtn').onclick = () => { PW = $('#pw').value; sessionStorage.setItem('plan-admin-pw', PW); $('#loginErr').innerHTML = ''; load(); };
$('#pw').onkeydown = e => { if (e.key === 'Enter') $('#loginBtn').click(); };
$('#logout').onclick = logout;
$('#refresh').onclick = load;
$('#q').oninput = draw; $('#sort').onchange = draw;
const setAuto = () => { clearInterval(autoT); if ($('#auto').checked) autoT = setInterval(() => { if (!$('#dash').hidden && !$('#dlg').open) load(); }, 30000); };
$('#auto').onchange = setAuto; setAuto();

/* 연습 모드(?demo): 서버 없이 예시 학생 */
let DEMO_LIST = null;
function demo(b){
  if (!DEMO_LIST) { const now = Date.now();
    DEMO_LIST = [['코코아','품질 검사 담당',20,[1,1,1,1,1,1],2,'품질 검사 결과를 수기로 입력해서 오류가 많이 난다.','태블릿 검사 입력 화면',7],['민트','생산기술',12,[1,1,1,0,0,0],15,'설비 배치를 바꿀 때마다 라인을 멈추고 검증한다.','',3],['라떼','자재 물류',4,[1,0,0,0,0,0],48,'부품 대차 정렬이 틀려 공정이 자주 멈춘다.','',1]]
      .map(([nick, job, n, ch, m, oneline, final, ai], i) => ({id:'demo' + i + 'abcdef', nick, job, oneline, final, sentence:oneline, aiUsed:ai, mood0:'🙂', mood1:n === 20 ? '🔥' : '',
        progress:{n, total:20, chapters:ch.map(Boolean), ch:ch.lastIndexOf(1) + 1 > 5 ? 5 : ch.lastIndexOf(1) + 1}, ws:'[0] 나의 직무 문제 한 줄: ' + oneline, report:n === 20 ? '# 예시 기획서\n## 1. 한 줄 요약\n연습 모드 예시예요.' : '', updated:new Date(now - m * 60000).toISOString()})); }
  if (b.action === 'delete') DEMO_LIST = DEMO_LIST.filter(s => s.id !== b.id);
  if (b.action === 'deleteAll') DEMO_LIST = [];
  return Promise.resolve({ok:true, students:DEMO_LIST});
}
document.querySelectorAll('.hide-login').forEach(b => b.hidden = true);
if (PW || DEMO) { if (DEMO) PW = 'demo'; load(); }
</script>
</body>
</html>
