<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나의 직무 기획 다이어리 · 5일차</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fffdf7; --desk:#efe8dc; --ink:#2a2430; --muted:#5d5566; --bd:#b9ab9b; --line:#e7dccd;
  --pink:#f8dfe2; --pink2:#c2546a; --mint:#d9efe3; --mint2:#2f8a63; --butter:#f8eccb;
  --lav:#e6e1f4; --lav2:#6253a8; --sky:#dce9f6; --sky2:#33699c; --peach:#f8e2d0;
  --hf:'Jua','Gowun Dodum',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{font-size:20px;scroll-behavior:smooth}
@media (max-width:560px){html{font-size:18px}}
body{margin:0;background:var(--desk);color:var(--ink);font-family:'Gowun Dodum',system-ui,sans-serif;font-size:1.1rem;line-height:1.75;min-height:100vh}
button{font:inherit;cursor:pointer;color:inherit}
input,textarea{font:inherit;font-size:1.2rem;color:inherit;width:100%;padding:12px 16px;border:2px solid #d8ccbc;border-radius:14px;background:#fff;outline:none;transition:border .15s,box-shadow .15s}
textarea{resize:vertical;min-height:100px;line-height:2.2rem;padding-top:4px;
  background:#fff repeating-linear-gradient(transparent 0 calc(2.2rem - 1px),#eadfd0 calc(2.2rem - 1px) 2.2rem) local}
input:focus,textarea:focus{border-color:var(--pink2);box-shadow:0 0 0 4px #f4d9de}
input::placeholder,textarea::placeholder{color:#a69c92}
.wrap{max-width:900px;margin:0 auto;padding:0 14px}

/* 상단 */
.top{position:sticky;top:0;z-index:30;background:rgba(239,232,220,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:6px}
.logo{font-family:var(--hf);font-size:1.45rem;line-height:1.1;white-space:nowrap}
.logo small{display:block;font-family:'Gowun Dodum';font-size:.7rem;color:var(--muted)}
.xp{flex:1;min-width:90px}
.xplabel{display:flex;justify-content:space-between;font-family:var(--hf);font-size:.85rem}
.xpbar{height:18px;border:2px solid var(--bd);border-radius:99px;background:#fff;overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f0a3b1,var(--pink2));transition:width .7s cubic-bezier(.3,1.5,.5,1)}
.ibtn{border:2px solid var(--bd);background:#fff;border-radius:99px;padding:4px 12px;font-size:.85rem;white-space:nowrap}
@media (max-width:600px){.logo small,.ibtn .t{display:none}.top .wrap{flex-wrap:wrap}.xp{order:3;flex-basis:100%}}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:4px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:84px;border:2px solid var(--bd);border-bottom:none;border-radius:16px 16px 0 0;padding:4px 4px 2px;text-align:center;font-family:var(--hf);font-size:.85rem;line-height:1.2;opacity:.75;transform:translateY(5px);transition:transform .2s}
.tab .e{display:block;font-size:1.3rem}
.tab small{display:block;font-family:'Gowun Dodum';font-size:.65rem}
.tab.on{opacity:1;transform:none}
.tab.done .e::after{content:'✔';font-size:.75rem;color:var(--mint2)}
.k0{background:var(--pink)}.k1{background:var(--sky)}.k2{background:var(--butter)}.k3{background:var(--lav)}.k4{background:var(--mint)}.k5{background:var(--peach)}

/* 다이어리: 장(chapter)마다 한 장의 종이, 아래로 쭉 */
.book{padding:22px 0 130px}
.page{position:relative;background:var(--paper);border:2px solid var(--bd);border-radius:8px 26px 26px 26px;padding:40px 28px 24px 54px;margin-bottom:34px;box-shadow:0 6px 24px rgba(42,36,48,.09);scroll-margin-top:170px}
.page::before{content:'';position:absolute;left:30px;top:0;bottom:0;border-left:2px solid #efc9cf}
.holes{position:absolute;left:-13px;top:44px;bottom:44px;display:flex;flex-direction:column;justify-content:space-around}
.holes i{width:24px;height:24px;border-radius:50%;background:var(--desk);border:2px solid var(--bd)}
.tape{position:absolute;top:-15px;left:50%;width:130px;height:30px;transform:translateX(-50%) rotate(-2deg);opacity:.7;background:repeating-linear-gradient(90deg,rgba(255,255,255,.4) 0 7px,transparent 7px 14px),var(--tc,#f6c1cb)}
@media (max-width:560px){.page{padding:34px 16px 20px 38px}.page::before{left:22px}.holes{left:-11px}.holes i{width:20px;height:20px}}
.date{font-size:.85rem;color:var(--muted);text-align:right;margin:-18px 0 0}
.flip{animation:flip .4s ease-out}
@keyframes flip{from{opacity:0;transform:translateX(30px) rotate(.6deg)}to{opacity:1;transform:none}}
.chtitle{font-family:var(--hf);font-size:2.1rem;line-height:1.3;margin:0 0 4px}
.chtitle .e{font-size:2.3rem;margin-right:6px}
.sec{position:relative;padding:26px 0 24px;border-top:3px dashed var(--line);scroll-margin-top:170px}
.sec:first-of-type{border-top:none}
.done-badge{position:absolute;right:0;top:22px;font-family:var(--hf);font-size:.9rem;padding:2px 12px;border-radius:99px;background:#eee7dc;color:var(--muted)}
.done-badge.ok{background:var(--mint);color:var(--mint2)}
.kicker{display:inline-block;font-family:var(--hf);font-size:.9rem;padding:2px 14px;border-radius:99px;background:var(--butter);margin-bottom:6px}
h2.q{font-family:var(--hf);font-weight:400;font-size:1.8rem;line-height:1.35;margin:4px 0 6px;padding-right:90px}
.sub{color:var(--muted);margin:0 0 14px}
h3{font-family:var(--hf);font-weight:400;font-size:1.35rem;margin:22px 0 8px}
label.lab{display:block;font-family:var(--hf);font-size:1.15rem;margin:16px 0 6px}
label.lab small{font-family:'Gowun Dodum';color:var(--muted);font-size:.85rem;margin-left:6px}
.ex{background:#faf5ec;border:2px dashed #dccfbd;border-radius:14px;padding:10px 16px;margin:12px 0;color:var(--muted);font-size:1rem}
.ex b{color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:200px}

/* 버기 */
.buggy{display:flex;gap:12px;align-items:flex-start;margin:6px 0 10px}
.buggy .face{font-size:2.6rem;line-height:1;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(-6deg)}}
.bubble{background:#fff;border:2px solid var(--bd);border-radius:6px 20px 20px 20px;padding:10px 16px;font-size:1.05rem}
.bubble b{color:var(--pink2)}

/* 버튼 */
.btn{border:2px solid var(--ink);background:#fff;border-radius:16px;padding:10px 20px;font-family:var(--hf);font-size:1.15rem;box-shadow:0 4px 0 var(--ink);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn.pri{background:var(--pink2);color:#fff;border-color:#8c3346;box-shadow:0 4px 0 #8c3346}
.btn.ai{background:var(--lav2);color:#fff;border-color:#3f3480;box-shadow:0 4px 0 #3f3480}
.btn.sm{font-size:.95rem;padding:5px 14px;border-radius:12px;box-shadow:0 3px 0 var(--ink)}
.btn:disabled{opacity:.5;cursor:wait}
.chip{border:2px solid var(--bd);background:#fff;border-radius:99px;padding:5px 16px;font-size:1rem;margin:3px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* 하단 진행 막대 */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(239,232,220,.96);border-top:1px solid var(--line);backdrop-filter:blur(6px)}
.nav .wrap{display:flex;align-items:center;gap:12px;padding-top:8px;padding-bottom:10px}
.dots{flex:1;text-align:center;font-family:var(--hf);color:var(--muted);font-size:1rem}
.dots .bar{height:10px;background:#fff;border:1.5px solid var(--bd);border-radius:99px;overflow:hidden;margin-top:3px}
.dots .bar i{display:block;height:100%;background:var(--mint2);transition:width .4s}

/* 문제정의 공식 */
.formula{font-size:1.35rem;line-height:2.1;background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 18px;font-weight:700}
.f-target{color:var(--ink)}.f-situ{color:#2f6fd0}.f-pain{color:#5b5fd6}.f-impact{color:#e0582f}
.formula .empty{opacity:.55}

/* 카드 */
.card{border:2px solid var(--line);border-radius:18px;padding:16px 18px;margin:14px 0;background:#fff}
.card.star{border-color:#e7b93c;background:#fffaf0;box-shadow:0 0 0 4px #fbefc9}
.card h4{font-family:var(--hf);font-weight:400;font-size:1.2rem;margin:0 0 6px}
.starbtn{font-size:1.8rem;background:none;border:none;line-height:1;filter:grayscale(1);opacity:.4;transition:transform .2s}
.starbtn.on{filter:none;opacity:1;transform:scale(1.2) rotate(-12deg)}
.chk{display:flex;align-items:center;gap:10px;font-size:1.05rem;margin:8px 0;cursor:pointer}
.chk input{width:28px;height:28px;flex:none;accent-color:var(--mint2)}

/* SCAMPER */
.letter{display:flex;align-items:center;gap:18px;margin-bottom:10px}
.big{width:96px;height:112px;flex:none;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--hf);font-size:3.6rem;line-height:1;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.big small{font-size:.8rem;margin-top:6px}
.LS{background:#e0607a}.LC{background:#e5893c}.LA{background:#c79a19}.LM{background:#3f9c6b}.LP{background:#3d7fc0}.LE{background:#7b62c9}.LR{background:#b0479b}
.lettertitle{font-family:var(--hf);font-size:1.8rem;line-height:1.3}
.lettertitle small{display:block;font-family:'Gowun Dodum';font-size:1rem;color:var(--muted)}
.dice.roll{animation:roll .5s}
@keyframes roll{50%{transform:rotate(200deg) scale(1.3)}}
.hint{font-size:1.15rem;background:var(--butter);border-radius:14px;padding:10px 16px;margin:10px 0}
.timer{font-family:var(--hf);font-size:1.3rem;color:var(--pink2)}
.meter{background:#fff;border:2px solid var(--bd);border-radius:99px;height:26px;overflow:hidden;position:relative;margin:6px 0 4px}
.meter i{display:block;height:100%;background:repeating-linear-gradient(45deg,#f5b8c3 0 12px,#f0a3b1 12px 24px);transition:width .5s}
.meter span{position:absolute;inset:0;text-align:center;font-family:var(--hf);font-size:.95rem;line-height:22px}

/* AI 결과 */
.aibox{border:2px solid #c9c0ea;background:#f7f5fd;border-radius:18px;padding:14px 18px;margin:14px 0}
.aibox h4{color:var(--lav2)}
.idea{display:flex;gap:10px;align-items:flex-start;border-bottom:1px dashed #d8d1ee;padding:8px 0}
.idea:last-child{border-bottom:none}
.idea .t{flex:1}
.idea .t b{font-size:1.1rem}
.idea .t div{color:var(--muted);font-size:.98rem}
.tag{display:inline-block;font-size:.8rem;padding:0 10px;border-radius:99px;background:var(--butter);margin-left:6px}
.loading{display:flex;align-items:center;gap:12px;font-size:1.1rem;color:var(--lav2);padding:14px}
.loading .spin{font-size:2rem;animation:bob .8s infinite}
.err{border:2px solid #e6a3ae;background:#fff3f4;border-radius:16px;padding:12px 16px;margin:12px 0}
details{margin:12px 0}
summary{cursor:pointer;font-family:var(--hf);font-size:1.05rem;color:var(--lav2)}
pre.prompt{white-space:pre-wrap;background:#fff;border:2px dashed #c9c0ea;border-radius:12px;padding:12px;font-size:.85rem;line-height:1.6;max-height:320px;overflow:auto}

/* 표 */
.tbl{width:100%;border-collapse:collapse;font-size:1rem;margin:10px 0}
.tbl th,.tbl td{border:1.5px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.tbl th{background:#2f3a5c;color:#fff;font-family:var(--hf);font-weight:400}
.tbl td.l{font-family:var(--hf);white-space:nowrap;background:#f6f1e8}
.tbl input[type=text]{font-size:1rem;padding:6px 10px;border-radius:10px;min-width:160px}
.tbl input[type=checkbox]{width:24px;height:24px;accent-color:var(--mint2)}
.scroll{overflow-x:auto}

/* 비교 */
.lv{display:inline-flex;border:2px solid var(--bd);border-radius:12px;overflow:hidden}
.lv button{border:none;background:#fff;padding:4px 14px;font-family:var(--hf);font-size:1.05rem}
.lv button+button{border-left:2px solid var(--bd)}
.lv button.on.v3{background:var(--mint2);color:#fff}.lv button.on.v2{background:#e3b23c;color:#fff}.lv button.on.v1{background:#d06a6a;color:#fff}
.crit{display:grid;grid-template-columns:110px auto 1fr;gap:8px 10px;align-items:center;margin-top:8px}
.crit .n{font-family:var(--hf);font-size:1.05rem;line-height:1.2}.crit .n small{display:block;font-family:'Gowun Dodum';font-size:.75rem;color:var(--muted)}
.crit input{font-size:1rem;padding:6px 12px}
@media (max-width:560px){.crit{grid-template-columns:1fr auto}.crit input{grid-column:1/3}}
.medal{font-size:2rem;float:right}

/* 스탬프·폭죽·토스트 */
.stampfx{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;pointer-events:none}
.stampfx div{font-family:var(--hf);font-size:2.4rem;color:var(--pink2);border:6px double var(--pink2);border-radius:24px;padding:16px 30px;background:rgba(255,253,247,.95);transform:rotate(-8deg);text-align:center;animation:stamp .7s cubic-bezier(.3,1.6,.5,1)}
.stampfx div span{display:block;font-size:4rem}
@keyframes stamp{from{transform:scale(3) rotate(10deg);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
.conf{position:fixed;top:-40px;z-index:70;font-size:1.8rem;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:90;background:var(--ink);color:#fff;border-radius:99px;padding:10px 24px;font-size:1.05rem;max-width:90vw;text-align:center}
.moods button{font-size:2.4rem;background:#fff;border:3px solid var(--line);border-radius:20px;width:72px;height:72px;margin:4px;transition:transform .15s}
.moods button.on{border-color:var(--pink2);transform:scale(1.15) rotate(-6deg)}
.stickers{display:flex;flex-wrap:wrap;gap:12px}
.sticker{width:120px;text-align:center;font-family:var(--hf);font-size:.95rem;background:#fff;border:2px dashed var(--line);border-radius:18px;padding:10px 6px;opacity:.35}
.sticker span{display:block;font-size:2.6rem}
.sticker.got{opacity:1;border:2px solid #e7b93c;background:#fffaf0;transform:rotate(-3deg)}
.report{font-size:1.05rem}
.report h1{font-family:var(--hf);font-weight:400;font-size:1.8rem;line-height:1.3;border-bottom:3px double var(--bd);padding-bottom:8px}
.report h2{font-family:var(--hf);font-weight:400;font-size:1.35rem;margin:22px 0 6px;color:var(--sky2)}
.report ul,.report ol{padding-left:1.4em;margin:6px 0}
.warn{color:#b3263d;font-size:.95rem}

@media print{
  .top,.nav,.buggy,.noprint,.btn{display:none!important}
  body{background:#fff;font-size:12pt}
  .page{border:none;box-shadow:none;padding:0}.page::before,.holes,.tape{display:none}
  .book{padding:0}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="logo">나의 직무 기획 다이어리 ✏️<small>5일차 · 직무 문제 기획 워크시트</small></div>
    <div class="xp">
      <div class="xplabel"><span id="lvName">🌱 새싹 기획러</span><span id="xpNum">0 XP</span></div>
      <div class="xpbar"><i id="xpBar"></i></div>
    </div>
    <button class="ibtn" id="sndBtn" title="소리">🔔<span class="t"> 소리</span></button>
    <button class="ibtn" id="menuBtn">☰<span class="t"> 메뉴</span></button>
  </div>
  <div class="wrap"><nav class="tabs" id="tabs"></nav></div>
</header>

<main class="wrap book" id="book"></main>

<footer class="nav">
  <div class="wrap">
    <button class="btn" id="prevBtn">◀ 이전 장</button>
    <div class="dots"><span id="stepNum"></span><div class="bar"><i id="stepBar"></i></div></div>
    <button class="btn pri" id="nextBtn">다음 장 ▶</button>
  </div>
</footer>

<script>
'use strict';
/* =========================================================
   상태
   ========================================================= */
const KEY = 'plan-diary-d5-v2';
const LETTERS = ['S','C','A','M','P','E','R'];
const blank = () => ({
  ch:0, xp:0, awards:{}, stamps:{}, sound:true,
  nick:'', job:'', mood0:'', mood1:'',
  oneline:'', target:'', situ:'', pain:'', impact:'', goal:'', sentence:'', sentenceEdited:false, check:null,
  causes:[0,1,2].map(() => ({t:'',lens:'',ev:'',note:'',q:''})), star:-1, aiCause:null,
  sc:Object.fromEntries(LETTERS.map(L => [L, {a:'',b:'',ca:false,cb:false}])), aiSc:null,
  picks:[0,1,2].map(() => ({t:'',c:[false,false,false]})),
  cmp:[0,1,2].map(() => [0,1,2,3].map(() => ({v:0,why:''}))),
  final:'', finalWhy:'',
  kpi:{r:{kpi:'',now:'',target:'',how:''},p:{kpi:'',now:'',target:'',how:''}}, aiKpi:null,
  scope:{input:'',list:'',must:['','',''],later:'',except:'실명, 실제 회사 기밀 데이터, 유료 도구'},
  report:'',
});
let D;
try { D = Object.assign(blank(), JSON.parse(localStorage.getItem(KEY) || '{}')); } catch(e) { D = blank(); }
let saveT;
const save = () => { clearTimeout(saveT); saveT = setTimeout(() => localStorage.setItem(KEY, JSON.stringify(D)), 250); };
const DEMO = new URLSearchParams(location.search).has('demo');

/* =========================================================
   도우미
   ========================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const getP = p => p.split('.').reduce((o,k) => o == null ? undefined : o[k], D);
const setP = (p,v) => { const ks = p.split('.'); const last = ks.pop(); ks.reduce((o,k) => o[k], D)[last] = v; save(); };
const filled = s => String(s || '').trim().length > 0;
const pick = a => a[Math.floor(Math.random() * a.length)];
const hasB = w => { const c = String(w).replace(/\s*\([^)]*\)\s*$/, '').trim().slice(-1).charCodeAt(0); return c >= 0xAC00 && c <= 0xD7A3 ? (c - 0xAC00) % 28 > 0 : null; };
const josa = (w, a, b) => { const h = hasB(w); return h === null ? `${a}(${b})` : (h ? a : b); };
function toast(msg){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), 2300); }

/* 소리 (WebAudio, 파일 없음) */
let AC;
function beep(kind){
  if (!D.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const seq = {tick:[[880,.06]], ok:[[660,.08],[990,.12]], up:[[523,.1],[659,.1],[784,.1],[1047,.22]], stamp:[[220,.12],[330,.18]], dice:[[500,.04],[700,.04],[600,.04],[900,.08]]}[kind] || [[600,.08]];
    let t = AC.currentTime;
    for (const [f,d] of seq) {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d); t += d * .9;
    }
  } catch(e){}
}
function confetti(n = 40){
  const em = ['🎉','✨','⭐','💡','🌸','🎈','💖'];
  for (let i = 0; i < n; i++) {
    const s = document.createElement('div'); s.className = 'conf'; s.textContent = pick(em);
    s.style.left = Math.random() * 100 + 'vw'; s.style.animationDuration = (1.8 + Math.random() * 1.8) + 's'; s.style.animationDelay = Math.random() * .5 + 's';
    document.body.append(s); setTimeout(() => s.remove(), 4500);
  }
}

/* XP · 레벨 */
const LEVELS = [[0,'🌱 새싹 기획러'],[80,'🔍 문제 탐정'],[200,'🎨 아이디어 화가'],[340,'🤖 AI 조련사'],[460,'🏆 기획 장인'],[580,'👑 기획 마스터']];
const levelOf = xp => LEVELS.filter(l => xp >= l[0]).pop();
function award(key, n, msg){
  if (D.awards[key]) return;
  D.awards[key] = true;
  const before = levelOf(D.xp);
  D.xp += n; save(); drawXP();
  if (msg) toast(`+${n} XP · ${msg}`);
  const after = levelOf(D.xp);

let PROMPTS = null;
fetch('prompts.json').then(r => r.json()).then(j => { PROMPTS = j; updateLive(); }).catch(() => {});
function promptText(task, payload){
  if (!PROMPTS) return '(프롬프트 파일을 불러오지 못했어요)';
  const t = PROMPTS.tasks[task];
  const user = t.user.replace(/\{\{(\w+)\}\}/g, (_, k) => filled(payload[k]) ? payload[k] : '[  ]');
  return PROMPTS.base + t.system + (t.mode === 'json' ? PROMPTS.json_rule : '') + '\n\n---\n\n' + user;
}
async function callAI(task, payload){
  if (DEMO) { await new Promise(r => setTimeout(r, 1200)); return demoAnswer(task); }
  const r = await fetch('api.php', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({task, payload, nick:D.nick.slice(0, 20)})});
  let j; try { j = await r.json(); } catch(e) { throw new Error('AI 서버(api.php)에 연결하지 못했어요'); }
  if (!r.ok || j.error) throw new Error(j.error || ('오류 ' + r.status));
  return j.result;
}
/* AI 버튼 공통: 로딩 → 결과 콜백, 실패 시 '직접 복사해서 AI에 붙이기' 대안 */
async function runAI(task, payload, box, onDone, xpKey){
  box.innerHTML = `<div class="loading"><span class="spin">🐞</span><span>버기가 생각하는 중이에요… ${task === 'scamper' || task === 'final' ? '(30초~1분)' : ''}</span></div>`;
  document.querySelectorAll('.btn.ai').forEach(b => b.disabled = true);
  try {
    const res = await callAI(task, payload);
    onDone(res); save();
    if (xpKey) award(xpKey, 15, 'AI 도움 받기');
  } catch(e) {
    box.innerHTML = `<div class="err"><b>😢 ${esc(e.message)}</b>
      <p style="margin:6px 0">괜찮아요! 아래 프롬프트를 복사해서 ChatGPT·Claude 같은 AI에 직접 붙여 넣고, 받은 답을 다시 여기에 붙여 넣어도 돼요.</p>
      <div class="row"><button class="btn sm" data-copy>📋 프롬프트 복사</button><button class="btn sm" data-retry>🔄 다시 시도</button></div>
      <textarea data-paste placeholder="AI가 준 답을 여기에 붙여 넣기" style="margin-top:10px"></textarea>
      <button class="btn sm" data-apply style="margin-top:8px">붙여 넣은 답 적용하기</button></div>`;
    box.querySelector('[data-copy]').onclick = () => { navigator.clipboard.writeText(promptText(task, payload)); toast('프롬프트를 복사했어요'); };
    box.querySelector('[data-retry]').onclick = () => runAI(task, payload, box, onDone, xpKey);
    box.querySelector('[data-apply]').onclick = () => {
      const txt = box.querySelector('[data-paste]').value.trim(); if (!txt) return toast('답을 먼저 붙여 넣어 주세요');
      if (PROMPTS && PROMPTS.tasks[task].mode === 'text') { onDone({text:txt}); save(); return; }
      const s = txt.indexOf('{'), e2 = txt.lastIndexOf('}');
      try { onDone(JSON.parse(txt.slice(s, e2 + 1))); save(); } catch(err) { toast('JSON 모양의 답이 아니에요. 프롬프트를 다시 붙여 보세요'); }
    };
  } finally {
    document.querySelectorAll('.btn.ai').forEach(b => b.disabled = false);
  }
}

function md(s){
  const lines = esc(s).split('\n'); let h = '', list = '';
  const close = () => { if (list) { h += `</${list}>`; list = ''; } };
  const inl = t => t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  for (const ln of lines) {
    let m;
    if ((m = ln.match(/^(#{1,3})\s+(.*)/))) { close(); const n = m[1].length; h += `<h${n}>${inl(m[2])}</h${n}>`; }
    else if ((m = ln.match(/^\s*[-*]\s+(.*)/))) { if (list !== 'ul') { close(); h += '<ul>'; list = 'ul'; } h += `<li>${inl(m[1])}</li>`; }
    else if ((m = ln.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== 'ol') { close(); h += '<ol>'; list = 'ol'; } h += `<li>${inl(m[1])}</li>`; }
    else if (!ln.trim()) close();
    else { close(); h += `<p>${inl(ln)}</p>`; }
  }
  close(); return h;
}

  else if (a === '2') { const t = prompt('내려받은 파일 내용을 붙여 넣어 주세요'); try { D = Object.assign(blank(), JSON.parse(t)); save(); renderAll(); drawXP(); toast('불러왔어요'); } catch(e) { toast('불러오지 못했어요'); } }
  else if (a === '3') { if (confirm('지금까지 쓴 내용이 모두 지워져요. 정말 처음부터 쓸까요?')) { D = blank(); localStorage.removeItem(KEY); renderAll(true); drawXP(); window.scrollTo(0, 0); } }
};
